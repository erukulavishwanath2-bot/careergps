<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Career GPS | Step-by-Step Career Roadmap Platform</title>
  <meta name="description" content="Discover your ideal career path with Career GPS. Interactive assessments, personalized roadmaps, skill building, AI interview coaching, and career opportunities.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <style>
    /* ==========================================================================
       Career GPS - Core Glassmorphism Design System
       ========================================================================== */
    :root {
      --bg-dark: #090d16;
      --bg-card: rgba(18, 26, 44, 0.75);
      --bg-card-hover: rgba(26, 38, 64, 0.9);
      --border-glass: rgba(255, 255, 255, 0.08);
      --border-glass-glow: rgba(99, 102, 241, 0.35);

      --primary: #6366f1;
      --primary-glow: rgba(99, 102, 241, 0.4);
      --secondary: #06b6d4;
      --accent-purple: #8b5cf6;
      --accent-emerald: #10b981;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;

      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-subtle: #64748b;

      --grad-primary: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #d946ef 100%);
      --grad-cyan: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
      --grad-emerald: linear-gradient(135deg, #10b981 0%, #059669 100%);
      --grad-gold: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);

      --font-heading: 'Outfit', sans-serif;
      --font-body: 'Plus Jakarta Sans', sans-serif;

      --shadow-sm: 0 4px 14px rgba(0, 0, 0, 0.3);
      --shadow-lg: 0 12px 36px rgba(0, 0, 0, 0.5);
    }

    [data-theme="light"] {
      --bg-dark: #f1f5f9;
      --bg-card: rgba(255, 255, 255, 0.9);
      --bg-card-hover: rgba(255, 255, 255, 0.98);
      --border-glass: rgba(0, 0, 0, 0.08);
      --border-glass-glow: rgba(99, 102, 241, 0.4);
      --text-main: #0f172a;
      --text-muted: #475569;
      --text-subtle: #64748b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: var(--font-body);
      line-height: 1.6;
      min-height: 100vh;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(99, 102, 241, 0.14) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(6, 182, 212, 0.14) 0%, transparent 40%);
      background-attachment: fixed;
    }

    h1, h2, h3, h4 { font-family: var(--font-heading); letter-spacing: -0.02em; }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); }
    ::-webkit-scrollbar-thumb { background: rgba(99,102,241,0.3); border-radius: 4px; }

    /* Glass Panels */
    .glass-panel {
      background: var(--bg-card);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      border-radius: 20px;
      box-shadow: var(--shadow-sm);
      transition: all 0.3s ease;
    }
    .glass-panel:hover { border-color: var(--border-glass-glow); }
    .glass-card-interactive { cursor: pointer; }
    .glass-card-interactive:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-lg), 0 0 24px rgba(99, 102, 241, 0.2);
    }

    /* Buttons */
    .btn-primary {
      background: var(--grad-primary);
      color: #fff;
      font-family: var(--font-heading);
      font-weight: 700;
      padding: 10px 22px;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.4);
      transition: all 0.25s ease;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(99, 102, 241, 0.6);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      font-family: var(--font-heading);
      font-weight: 600;
      padding: 10px 20px;
      border-radius: 12px;
      border: 1px solid var(--border-glass);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.25s ease;
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--border-glass-glow);
    }

    /* Gradient Text & Badges */
    .gradient-text {
      background: var(--grad-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .badge-primary { background: rgba(99, 102, 241, 0.15); color: #818cf8; border: 1px solid rgba(99, 102, 241, 0.3); }
    .badge-emerald { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-amber { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-cyan { background: rgba(6, 182, 212, 0.15); color: #38bdf8; border: 1px solid rgba(6, 182, 212, 0.3); }

    /* Layout Grids */
    .app-container { max-width: 1400px; margin: 0 auto; padding: 24px 20px 80px 20px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
    @media (max-width: 1024px) { .grid-4, .grid-3 { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 640px) { .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; } }

    .progress-bar-bg { width: 100%; height: 8px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: var(--grad-primary); border-radius: 10px; transition: width 0.5s ease; }
  </style>
  <script type="module" crossorigin src="/assets/index-zzh0Gayp.js"></script>
</head>
<body>

  <div id="app"></div>

  <!-- Main Application Script -->
</body>
</html>
